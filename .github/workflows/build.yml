name: Compilar EMA Trader
run-name: EMA Trader · ${{ github.ref_name }} · #${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publicar a Release depois de compilar todas as plataformas
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
            desktop: true
          - os: macos-15
            target: macos-arm64
            desktop: true
          - os: macos-15-intel
            target: macos-x64
            desktop: true
          - os: ubuntu-24.04
            target: linux-x64
            desktop: false
          - os: ubuntu-24.04-arm
            target: linux-arm64
            desktop: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0 pillow==11.3.0
      - name: Testar sem enviar ordens
        run: python -m unittest -v
      - name: Compilar terminal
        run: >
          python -m PyInstaller --noconfirm --onedir --exclude-module tkinter
          --add-data "knowledge:knowledge"
          --name ema-trader-cli --collect-data lighter --collect-binaries lighter app.py
      - name: Gerar ícone
        if: matrix.desktop
        run: python assets/make_icon.py
      - name: Compilar janela
        if: matrix.desktop
        run: >
          python -m PyInstaller --noconfirm --onedir --windowed
          --icon assets/icon.png --add-data "assets/icon.png:assets"
          --add-data "knowledge:knowledge"
          --name "EMA Trader" --osx-bundle-identifier org.ematrader.app
          --collect-data lighter --collect-binaries lighter gui_entry.py
      - name: Testar executável Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ".\dist\ema-trader-cli\ema-trader-cli.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($lang in 'pt', 'en', 'es') {
            & ".\dist\ema-trader-cli\ema-trader-cli.exe" --lang $lang --subaccounts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (!(Test-Path 'dist/EMA Trader/EMA Trader.exe')) { throw 'Janela ausente' }
          Compress-Archive -Path 'dist/*' -DestinationPath "EMA-Trader-${{ matrix.target }}.zip"
      - name: Empacotar Linux e macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./dist/ema-trader-cli/ema-trader-cli --help
          for lang in pt en es; do
            ./dist/ema-trader-cli/ema-trader-cli --lang "$lang" --subaccounts
          done
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test -d "dist/EMA Trader.app"
            tar -czf "EMA-Trader-${{ matrix.target }}.tar.gz" -C dist "EMA Trader.app" ema-trader-cli
          else
            tar -czf "EMA-Trader-${{ matrix.target }}.tar.gz" -C dist ema-trader-cli
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EMA-Trader-${{ matrix.target }}
          path: EMA-Trader-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar Release
    needs: build
    if: inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: EMA-Trader-*
          path: packages
          merge-multiple: true
      - name: Atestar procedência dos pacotes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: packages/EMA-Trader-*
      - name: Criar tag e anexar pacotes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.${{ github.run_number }}
        shell: bash
        run: |
          packages=(
            packages/EMA-Trader-windows-x64.zip
            packages/EMA-Trader-macos-arm64.tar.gz
            packages/EMA-Trader-macos-x64.tar.gz
            packages/EMA-Trader-linux-x64.tar.gz
            packages/EMA-Trader-linux-arm64.tar.gz
          )
          for package in "${packages[@]}"; do test -s "$package"; done
          (cd packages && sha256sum EMA-Trader-*) > packages/SHA256SUMS
          packages+=(packages/SHA256SUMS)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${packages[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${packages[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "EMA Trader $TAG" --generate-notes
          fi
